server:
  port: 8080

spring:
  application:
    name: prep-pilot-backend

  datasource:
    # Supabase: Project Settings -> Database -> Connection string (use the "Session pooler" or direct URI)
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_MIN_32_BYTES}
    access-token-expiration-ms: 3600000        # 1 hour
    refresh-token-expiration-ms: 604800000     # 7 days

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    provider: ${AI_PROVIDER:gemini}            # gemini | openai
    openai-api-key: ${OPENAI_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:gemini-1.5-flash}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-004}
    embedding-dimension: ${AI_EMBEDDING_DIM:768}

  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:prep-pilot-resumes}
      region: ${AWS_REGION:ap-south-1}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

  rag:
    chunk-size: 800
    chunk-overlap: 100
    top-k: 5

  rate-limit:
    code-run:
      max-requests: ${CODE_RUN_RATE_LIMIT:10}
      window-seconds: ${CODE_RUN_RATE_WINDOW_SECONDS:60}

logging:
  level:
    com.preppilot: INFO
    org.hibernate.SQL: WARN
