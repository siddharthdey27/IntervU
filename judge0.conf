# Minimal Judge0 config - see https://github.com/judge0/judge0/blob/master/judge0.conf.template for all options
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

REDIS_HOST=judge0-redis
REDIS_PORT=6379

# Leave auth disabled since Judge0 only needs to be reachable from your backend container,
# not the public internet. Do NOT expose port 2358 publicly without adding an API key.
ENABLE_WAIT_RESULT=true
